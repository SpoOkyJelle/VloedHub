<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>VloedHub — Inloggen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0C0F1D">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="prefetch" href="/styles/main.css">
  <link rel="prefetch" href="/vendor/fontawesome/css/all.min.css">
  <link rel="prefetch" href="/vendor/chartjs/chart.umd.min.js">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* html zelf is geen flex-container, anders krimpt body naar de breedte van zijn inhoud */
    html { display: block; }
    body { width: 100%; }

    /* De kolom vult het hele scherm; het toetsenblok krijgt alle ruimte die overblijft */
    .pin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0.75rem, 2.5vh, 1.75rem);
      padding: calc(clamp(1rem, 3vh, 2rem) + env(safe-area-inset-top, 0px)) 1.25rem calc(clamp(1rem, 3vh, 2rem) + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 520px;
      height: 100%;
    }

    @media (max-width: 480px) {
      .pin-wrap { padding-left: 0.75rem; padding-right: 0.75rem; max-width: 100%; }
      .pin-logo-icon { width: 120px; height: 120px; border-radius: 30px; }
      .pin-logo-sub { display: none; }
      .pin-dot  { width: 18px; height: 18px; }
    }

    /* Logo */
    .pin-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .pin-logo-icon {
      width: 140px;
      height: 140px;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
    }
    .pin-logo-icon img { width: 100%; height: 100%; display: block; }
    .pin-logo-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pin-logo-sub {
      font-size: var(--fs-xs);
      color: var(--muted);
    }

    /* Subtitle */
    .pin-subtitle {
      font-size: var(--fs-sm);
      color: var(--muted);
      text-align: center;
    }

    /* Dots */
    .pin-dots {
      display: flex;
      gap: 1rem;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--dim);
      background: transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.15);
    }
    .pin-dot.error {
      background: var(--red);
      border-color: var(--red);
    }
    .pin-dot.success {
      background: var(--green);
      border-color: var(--green);
    }

    /* Shake animation */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* Numpad */
    /* Het vak krijgt alle overgebleven ruimte; het toetsenblok wordt daarin zo groot mogelijk
       met vierkante toetsen (begrensd door de breedte of de hoogte, wat het eerst op is). */
    .pin-numpad-fit {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
    }
    .pin-numpad {
      --g: 0.75rem;
      --w: min(100cqw, calc((100cqh - var(--g) / 3) * 0.75), 460px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--g);
      width: var(--w);
      height: calc(var(--w) * 4 / 3 + var(--g) / 3);
    }
    .pin-key {
      min-height: 44px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: clamp(1.6rem, 9cqw, 2.6rem);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.1rem;
      transition: background 0.08s, border-color 0.08s, transform 0.05s;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:active {
      background: rgba(141,178,85,0.15);
      border-color: rgba(141,178,85,0.4);
      transform: scale(0.94);
    }
    .pin-key.spacer { visibility: hidden; pointer-events: none; }
    .pin-key.delete { font-size: clamp(1.2rem, 6.5cqw, 1.9rem); color: var(--muted); }
    .pin-key-sub {
      font-size: var(--fs-2xs);
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Error message */
    .pin-error {
      font-size: var(--fs-xs);
      color: var(--red);
      text-align: center;
      min-height: 1.2em;
      transition: opacity 0.2s;
    }

    /* First-time setup notice */
    .pin-setup-notice {
      font-size: var(--fs-xs);
      color: var(--muted);
      text-align: center;
      background: rgba(141,178,85,0.08);
      border: 1px solid rgba(141,178,85,0.2);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="pin-wrap">

  <div class="pin-logo">
    <div class="pin-logo-icon"><img src="/icons/icon-192.png" alt=""></div>
    <div class="pin-logo-title">VloedHub</div>
  </div>

  <div id="setup-notice" class="pin-setup-notice" style="display:none">
    Geen pincode ingesteld.<br>Kies een nieuwe 4-cijferige code.
  </div>

  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <div class="pin-error" id="pin-error"></div>

  <div class="pin-numpad-fit">
  <div class="pin-numpad">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2<span class="pin-key-sub">ABC</span></button>
    <button class="pin-key" data-key="3">3<span class="pin-key-sub">DEF</span></button>
    <button class="pin-key" data-key="4">4<span class="pin-key-sub">GHI</span></button>
    <button class="pin-key" data-key="5">5<span class="pin-key-sub">JKL</span></button>
    <button class="pin-key" data-key="6">6<span class="pin-key-sub">MNO</span></button>
    <button class="pin-key" data-key="7">7<span class="pin-key-sub">PQRS</span></button>
    <button class="pin-key" data-key="8">8<span class="pin-key-sub">TUV</span></button>
    <button class="pin-key" data-key="9">9<span class="pin-key-sub">WXYZ</span></button>
    <div class="pin-key spacer"></div>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key delete" data-key="del">⌫</button>
  </div>
  </div>

</div>
<script>
  var pin = '';
  var mode = 'login'; // 'login' | 'setup'
  var setupFirst = '';

  // Check if PIN is set
  fetch('/api/auth/status').then(function(r) { return r.json(); }).then(function(d) {
    if (!d.pinSet) {
      mode = 'setup';
      document.getElementById('setup-notice').style.display = '';
      document.getElementById('pin-subtitle').textContent = 'Kies een nieuwe pincode';
    }
  });

  function pressKey(digit) {
    if (pin.length >= 4) return;
    pin += digit;
    updateDots();
    if (pin.length === 4) submit();
  }

  function pressDelete() {
    if (pin.length === 0) return;
    pin = pin.slice(0, -1);
    updateDots();
    clearError();
  }

  function updateDots(state) {
    for (var i = 0; i < 4; i++) {
      var dot = document.getElementById('d' + i);
      dot.className = 'pin-dot';
      if (state) dot.classList.add(state);
      else if (i < pin.length) dot.classList.add('filled');
    }
  }

  function clearError() {
    document.getElementById('pin-error').textContent = '';
  }

  function showError(msg) {
    document.getElementById('pin-error').textContent = msg;
    var dots = document.getElementById('pin-dots');
    updateDots('error');
    dots.classList.add('shake');
    pin = ''; // meteen opnieuw kunnen typen, de animatie loopt gewoon door
    setTimeout(function() {
      dots.classList.remove('shake');
      updateDots();
    }, 420);
  }

  function submit() {
    if (mode === 'setup') {
      if (!setupFirst) {
        setupFirst = pin;
        pin = '';
        document.getElementById('pin-subtitle').textContent = 'Herhaal de pincode';
        document.getElementById('setup-notice').style.display = 'none';
        updateDots();
        return;
      }
      if (pin !== setupFirst) {
        setupFirst = '';
        document.getElementById('pin-subtitle').textContent = 'Kies een nieuwe pincode';
        document.getElementById('setup-notice').style.display = '';
        showError('Pincodes komen niet overeen');
        return;
      }
      // Set PIN then login
      fetch('/api/auth/set-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.ok) {
          // Now login with the new PIN
          return fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: pin })
          }).then(function(r) { return r.json(); });
        }
        throw new Error(d.error);
      }).then(function(d) {
        if (d.ok) {
          updateDots('success');
          window.location.href = '/';
        }
      }).catch(function(e) { showError(e.message || 'Fout'); });
      return;
    }

    // Normal login
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.ok) {
        updateDots('success');
        // alleen terug naar een pagina van VloedHub zelf: geen andere site en geen javascript:-adres
        var dest = new URLSearchParams(location.search).get('next') || '/';
        window.location.href = /^\/(?![\/\\])/.test(dest) ? dest : '/';
      } else {
        showError(d.error || 'Verkeerde pincode');
      }
    }).catch(function() { showError('Verbindingsfout'); });
  }

  // Numpad: reageer bij het aanraken, niet pas bij het loslaten
  var numpad = document.querySelector('.pin-numpad');
  function handleKey(btn) {
    if (!btn) return;
    if (btn.dataset.key === 'del') pressDelete();
    else pressKey(btn.dataset.key);
  }
  numpad.addEventListener('pointerdown', function(e) {
    if (e.button) return;
    handleKey(e.target.closest('[data-key]'));
  });
  numpad.addEventListener('click', function(e) {
    if (e.detail === 0) handleKey(e.target.closest('[data-key]')); // toetsenbord (Enter/spatie)
  });

  // Keyboard support
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    else if (e.key === 'Backspace') pressDelete();
  });
</script>
</body>
</html>
